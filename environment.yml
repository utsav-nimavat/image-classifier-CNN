name: image_cnn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - matplotlib
  - ipykernel
  - kagglehub
  - pip
  - pip:
      # torch resolves to the CUDA build on Windows/Linux and the MPS build on
      # macOS automatically -- same version string works on both machines.
      - torch==2.13.0
      - torchvision==0.28.0
      - opencv-python==5.0.0.93
      - ipywidgets==8.1.9
